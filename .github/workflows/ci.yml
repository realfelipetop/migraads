name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      # Roda o `npm start` de verdade (build + servidor em 127.0.0.1) e confere as telas.
      - name: Smoke test (npm start)
        run: npm run smoke
