<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F86F6"/>
      <stop offset="1" stop-color="#0B4DB0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#06306E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- Cartão de origem (contorno) -->
  <g opacity="0.55">
    <rect x="150" y="292" width="300" height="440" rx="44" fill="none" stroke="#FFFFFF" stroke-width="26"/>
    <rect x="196" y="340" width="208" height="150" rx="18" fill="#FFFFFF"/>
    <rect x="196" y="526" width="208" height="26" rx="13" fill="#FFFFFF"/>
    <rect x="196" y="578" width="140" height="26" rx="13" fill="#FFFFFF"/>
    <rect x="196" y="642" width="96" height="44" rx="22" fill="#FFFFFF"/>
  </g>

  <!-- Cartão de destino (sólido) -->
  <g filter="url(#shadow)">
    <rect x="574" y="292" width="300" height="440" rx="44" fill="#FFFFFF"/>
  </g>
  <rect x="620" y="340" width="208" height="150" rx="18" fill="#1D6FE0"/>
  <rect x="620" y="526" width="208" height="26" rx="13" fill="#B9D3F8"/>
  <rect x="620" y="578" width="140" height="26" rx="13" fill="#B9D3F8"/>
  <rect x="620" y="642" width="96" height="44" rx="22" fill="#1D6FE0"/>

  <!-- Seta de migração -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="118" fill="#FFFFFF"/>
  </g>
  <circle cx="512" cy="512" r="96" fill="#1D6FE0"/>
  <path d="M452 512 H560 M520 466 L570 512 L520 558" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
